# ===============================================================
# NexT Alternate Theme Config (from 5.1.4 → 8.29.0)
# Docs: https://theme-next.js.org/docs/getting-started/configuration
# 仅覆盖需从旧版保留或键名已变更的项；其余沿用 themes/next/_config.yml 默认值
# ===============================================================

# ---------------------------------------------------------------
# Scheme
# ---------------------------------------------------------------
scheme: Muse

# ---------------------------------------------------------------
# Menu（5.1.4 已启用 home / archives；图标升级为 Font Awesome 5）
# ---------------------------------------------------------------
menu:
  home: / || fa fa-home
  #about: /about/ || fa fa-user
  #tags: /tags/ || fa fa-tags
  #categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  #schedule: /schedule/ || fa fa-calendar
  #sitemap: /sitemap.xml || fa fa-sitemap

menu_settings:
  icons: true
  badges: false

# ---------------------------------------------------------------
# Sidebar
# ---------------------------------------------------------------
sidebar:
  position: left
  display: post
  offset: 12

#avatar:
#  url: /images/avatar.gif
#  rounded: false
#  rotated: false

social_icons:
  enable: true
  icons_only: false
  transition: false

#links_settings:
#  icon: fa fa-link
#  layout: block
#links:
#  Title: https://example.com

toc:
  enable: true
  number: true
  wrap: false

# ---------------------------------------------------------------
# Footer（footer.icon: user → 对象结构）
# ---------------------------------------------------------------
footer:
  #since: 2015
  icon:
    name: fa fa-user
    animated: false
    color: "#808080"
  copyright:
  powered: true

# ---------------------------------------------------------------
# Post
# ---------------------------------------------------------------
excerpt_description: true

post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: false
    another_day: true
  categories: true

# 字数统计依赖：npm i hexo-word-counter
#symbols_count_time:
#  separated_meta: true
#  item_text_total: false

# 文章 CC 声明（对应旧 post_copyright，默认关闭）
creative_commons:
  license: by-nc-sa
  size: small
  sidebar: false
  post: false
  language:

# ---------------------------------------------------------------
# Misc（android_chrome_color / highlight_theme / b2t 迁移）
# ---------------------------------------------------------------
theme_color:
  light: "#222"
  dark: "#222"

codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: false
  fold:
    enable: false
    height: 500
  language: false

back2top:
  enable: true
  sidebar: false
  scrollpercent: false

mobile_layout_economy: false

# ---------------------------------------------------------------
# Font（沿用 5.1.4：关闭自定义字体）
# ---------------------------------------------------------------
font:
  enable: false

# ---------------------------------------------------------------
# SEO
# ---------------------------------------------------------------
index_with_subtitle: false
exturl: false

# ---------------------------------------------------------------
# External libraries（5.1.4 fancybox 默认开启）
# ---------------------------------------------------------------
fancybox: true
#mediumzoom: false
#pjax: false

# ---------------------------------------------------------------
# Animation / Pace
# ---------------------------------------------------------------
motion:
  enable: true
  async: false

pace:
  enable: false
  color: blue
  theme: minimal

canvas_ribbon:
  enable: false
  size: 300
  alpha: 0.6
  zIndex: -1

# ---------------------------------------------------------------
# Comments（按需取消注释并填写；Gitment → Gitalk）
# ---------------------------------------------------------------
#disqus:
#  enable: false
#  shortname:
#  count: true

#gitalk:
#  enable: false
#  github_id:
#  repo:
#  client_id:
#  client_secret:
#  admin_user:
#  distraction_free_mode: true

# ---------------------------------------------------------------
# Analytics / Busuanzi（键名已变更，默认关闭）
# ---------------------------------------------------------------
#baidu_analytics:
#google_analytics:
#  tracking_id:

busuanzi_count:
  enable: false
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

# ---------------------------------------------------------------
# Search
# ---------------------------------------------------------------
algolia_search:
  enable: false
  hits:
    per_page: 10

# 依赖：npm i hexo-generator-searchdb
local_search:
  enable: false
  top_n_per_article: 1
  unescape: false
  preload: false

# ---------------------------------------------------------------
# Math（旧 mathjax → math.mathjax）
# ---------------------------------------------------------------
math:
  every_page: false
  mathjax:
    enable: false
    tags: none
  katex:
    enable: false
